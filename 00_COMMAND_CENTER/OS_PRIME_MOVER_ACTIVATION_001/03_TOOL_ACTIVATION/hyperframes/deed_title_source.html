<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14110f; }
      #root { width: 1080px; height: 1920px; position: relative; font-family: 'Didot','Bodoni 72',Georgia,serif; }
      .rule { position:absolute; left:90px; top:760px; width:120px; height:4px; background:#8e1c16; transform-origin:left center; }
      .eyebrow { position:absolute; left:92px; top:700px; font-family:Arial,sans-serif; letter-spacing:.34em; font-size:26px; color:#8e1c16; text-transform:uppercase; }
      .masthead { position:absolute; left:88px; top:800px; font-size:150px; color:#ece7dd; letter-spacing:2px; }
      .sub { position:absolute; left:92px; top:1000px; font-style:italic; font-size:44px; color:#cabba0; }
      .stamp { position:absolute; left:760px; top:1180px; width:150px; height:150px; border:7px solid #8e1c16; border-radius:50%; }
      .stamp::after { content:""; position:absolute; left:8px; top:64px; width:126px; height:7px; background:#8e1c16; }
      .foot { position:absolute; left:92px; top:1800px; font-family:Arial,sans-serif; letter-spacing:.22em; font-size:20px; color:#6f6a64; text-transform:uppercase; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="5" data-track-index="1">an archive in liquidation</div>
      <div id="rule" class="rule clip" data-start="0" data-duration="5" data-track-index="2"></div>
      <div id="masthead" class="masthead clip" data-start="0" data-duration="5" data-track-index="3">DEED 00</div>
      <div id="stamp" class="stamp clip" data-start="0" data-duration="5" data-track-index="4"></div>
      <div id="sub" class="sub clip" data-start="0" data-duration="5" data-track-index="5">everything is recorded, then surrendered</div>
      <div id="foot" class="foot clip" data-start="0" data-duration="5" data-track-index="6">deed office . filed as final</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#rule", { scaleX: 0, duration: 0.8, ease: "power3.out" }, 0.3);
      tl.from("#eyebrow", { opacity: 0, y: 12, duration: 0.7 }, 0.6);
      tl.from("#masthead", { opacity: 0, y: 40, duration: 1.0, ease: "power2.out" }, 0.7);
      tl.from("#stamp", { opacity: 0, scale: 0.0, rotation: -18, duration: 0.5, ease: "back.out(2)" }, 1.7);
      tl.from("#sub", { opacity: 0, duration: 0.8 }, 2.3);
      tl.from("#foot", { opacity: 0, duration: 0.8 }, 2.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
